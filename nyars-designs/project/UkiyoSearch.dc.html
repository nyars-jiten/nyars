<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Гравюра — поиск かける</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&amp;family=Shippori+Antique+B1&amp;family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&amp;family=Literata:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F1E6CF;color:#1E1C1A;font-family:'Literata',Georgia,serif;font-size:16px;line-height:1.5}
a{color:#1F3B6E}a:hover{color:#C4472F}
.za{font-family:'Zen Antique','Shippori Antique B1',serif}
.os{font-family:'Old Standard TT',Georgia,serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.sei{background-color:#1F3B6E;background-image:radial-gradient(circle at 100% 150%,#1F3B6E 24%,#2D5290 24%,#2D5290 28%,#1F3B6E 28%,#1F3B6E 36%,#2D5290 36%,#2D5290 40%,transparent 40%,transparent),radial-gradient(circle at 0 150%,#1F3B6E 24%,#2D5290 24%,#2D5290 28%,#1F3B6E 28%,#1F3B6E 36%,#2D5290 36%,#2D5290 40%,transparent 40%,transparent),radial-gradient(circle at 50% 100%,#2D5290 10%,#1F3B6E 10%,#1F3B6E 23%,#2D5290 23%,#2D5290 30%,#1F3B6E 30%,#1F3B6E 43%,#2D5290 43%,#2D5290 50%,#1F3B6E 50%,#1F3B6E 63%,#2D5290 63%,#2D5290 71%,transparent 71%,transparent);background-size:60px 30px}
.flip{perspective:1200px;background:transparent;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left;aspect-ratio:2/3;width:100%}
.inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #1E1C1A;box-shadow:5px 5px 0 #1E1C1A;overflow:hidden;box-sizing:border-box}
.front{background:#F7EEDB;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 10px}
.back{background:#1F3B6E;color:#F7EEDB;transform:rotateY(180deg);padding:16px;display:flex;flex-direction:column;gap:8px}
.band{position:absolute;left:0;right:0;bottom:0;height:38%}
.chip{height:40px;padding:0 14px;border:2px solid #1E1C1A;background:#F7EEDB;font-family:'Old Standard TT',serif;font-size:15px;cursor:pointer}
.chip[aria-pressed=true]{background:#1E1C1A;color:#F7EEDB}
@media (max-width:760px){.wrap{padding:0 16px}}
</style>
</helmet>
<div>
  <div class="sei" style="height: 22px" aria-hidden="true"></div>
  <header class="wrap" style="display: flex; align-items: center; gap: 16px 28px; flex-wrap: wrap; padding-top: 16px; padding-bottom: 16px; border-bottom: 3px solid #1E1C1A">
    <a href="UkiyoHome.dc.html" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: #1E1C1A"><span class="za" style="background: #E9C46A; border: 3px double #1E1C1A; font-size: 20px; padding: 2px 10px">辞書</span><span class="os" style="font-size: 28px; font-weight: 700">nyars</span></a>
    <form role="search" style="flex: 1 1 440px; display: flex; background: #F7EEDB; border: 3px solid #1E1C1A"><label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Поиск</label><input id="q" type="search" value="かける" class="za" style="flex: 1; min-width: 0; height: 50px; border: 0; background: transparent; padding: 0 16px; font-size: 22px; outline: none"><a href="#" class="za" aria-label="Искать" style="width: 56px; display: flex; align-items: center; justify-content: center; background: #C4472F; color: #F7EEDB; font-size: 22px; text-decoration: none; border-left: 3px solid #1E1C1A">尋</a></form>
  </header>

  <main class="wrap" style="padding-top: 32px; padding-bottom: 72px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 26px">
      <div style="flex: 1 1 520px">
        <h1 class="os" style="margin: 0; font-size: 72px; line-height: 1.05"><span class="za" lang="ja">かける</span></h1>
        
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button type="button" class="chip" onClick="{{ flipAll }}">Перевернуть все</button>
        <button type="button" class="chip" onClick="{{ resetAll }}">Лицом вверх</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 24px 20px">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="9">
        <button type="button" class="flip" onClick="{{ c.toggle }}" aria-pressed="{{ c.on }}" aria-label="Карта {{ c.w }}: {{ c.hint }}">
          <div class="inner" style="transform: {{ c.rot }}">
            <div class="face front">
              <div class="band" style="background: {{ c.band }}"></div>
              <span class="os" style="position: relative; font-size: 13px; font-style: italic">{{ c.month }}</span>
              <span class="za" lang="ja" style="position: relative; font-size: 54px; line-height: 1; writing-mode: vertical-rl; background: #F7EEDB; padding: 10px 4px; border: 2px solid #1E1C1A">{{ c.w }}</span>
              <span style="position: relative; background: #F7EEDB; border: 2px solid #1E1C1A; padding: 2px 10px; font-size: 14px; font-weight: 600">{{ c.hint }}</span>
            </div>
            <div class="face back">
              <span class="za" lang="ja" style="font-size: 30px">{{ c.w }}</span>
              <span class="os" style="font-size: 13px; font-style: italic; color: #E9C46A">{{ c.pos }}</span>
              <ol style="margin: 4px 0 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 4px">
                <sc-for list="{{ c.senses }}" as="s" hint-placeholder-count="3"><li>{{ s }}</li></sc-for>
              </ol>
              <span style="margin-top: auto; font-size: 13px; text-decoration: underline; color: #E9C46A">открыть статью →</span>
            </div>
          </div>
        </button>
      </sc-for>
    </div>

    <section aria-labelledby="ins" style="margin-top: 52px; border: 3px solid #1E1C1A; background: #F7EEDB; padding: 22px 26px; box-shadow: 6px 6px 0 #1E1C1A">
      <h2 id="ins" class="os" style="margin: 0 0 12px; font-size: 26px">Встречается внутри слов · 46</h2>
      <p class="za" lang="ja" style="margin: 0; font-size: 22px; line-height: 2"><a href="#">出かける</a>　<a href="#">見かける</a>　<a href="#">話しかける</a>　<a href="#">追いかける</a>　<a href="#">呼びかける</a>　<a href="#">腰掛ける</a>　<a href="#">押しかける</a>　<a href="#">心掛ける</a>　<span class="os" style="font-size: 16px; font-style: italic">и ещё 38…</span></p>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: {} }; }
  renderVals() {
    const f = this.state.f;
    const R = [
      { w: '掛ける', hint: 'вешать', pos: 'глагол · 15 значений', senses: ['вешать', 'надевать; накрывать', 'тратить (время)', 'звонить', '…ещё 11'], band: '#C4472F' },
      { w: '欠ける', hint: 'недоставать', pos: 'глагол', senses: ['откалываться', 'недоставать', 'убывать (о луне)'], band: '#E9C46A' },
      { w: '駆ける', hint: 'бежать', pos: 'глагол', senses: ['бежать, мчаться', 'скакать верхом'], band: '#6E7F6A' },
      { w: '賭ける', hint: 'ставить', pos: 'глагол', senses: ['ставить, держать пари', 'рисковать'], band: '#1E1C1A' },
      { w: '架ける', hint: 'мост', pos: 'глагол · обычно 掛ける', senses: ['наводить (мост)'], band: '#1F3B6E' },
      { w: '懸ける', hint: 'награда', pos: 'глагол', senses: ['назначать (награду)', 'ставить на карту'], band: '#C4472F' },
      { w: '翔る', hint: 'парить', pos: 'глагол · книжн.', senses: ['парить', 'мчаться'], band: '#9DB4C0' },
      { w: '書ける', hint: 'мочь писать', pos: 'форма от 書く', senses: ['мочь писать', 'хорошо пишется'], band: '#6E7F6A' },
      { w: '〜かける', hint: 'начать', pos: 'вспом. глагол', senses: ['начинать', 'не доделать', 'обращаться к кому-л.'], band: '#E9C46A' }
    ];
    const months = ['睦月', '如月', '弥生', '卯月', '皐月', '水無月', '文月', '葉月', '長月'];
    const cards = R.map((r, i) => ({ ...r, month: months[i], on: !!f[i], rot: f[i] ? 'rotateY(180deg)' : 'none',
      toggle: () => this.setState({ f: { ...f, [i]: !f[i] } }) }));
    const all = {}; R.forEach((_, i) => { all[i] = true; });
    return { cards, flipAll: () => this.setState({ f: all }), resetAll: () => this.setState({ f: {} }) };
  }
}
</script>
</body>
</html>
