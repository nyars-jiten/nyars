<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Неон — поиск かける</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=Exo+2:wght@400;500;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D17;color:#E6E9F5;font-family:'Exo 2',system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:#3DF5E0;text-decoration:none}a:hover{color:#fff;text-shadow:0 0 8px #3DF5E0}
.px{font-family:'DotGothic16',monospace}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.bg{background:radial-gradient(ellipse at 80% 0%,rgba(255,79,163,.14),transparent 50%),radial-gradient(ellipse at 0% 60%,rgba(61,245,224,.10),transparent 45%),#0B0D17}
.scan{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.glow-c{color:#3DF5E0;text-shadow:0 0 6px rgba(61,245,224,.9),0 0 22px rgba(61,245,224,.5)}
.glow-m{color:#FF4FA3;text-shadow:0 0 6px rgba(255,79,163,.9),0 0 22px rgba(255,79,163,.5)}
.box{border:1px solid #2A3050;background:rgba(20,24,41,.85);border-radius:6px}
.proc{height:40px;padding:0 14px;display:flex;align-items:center;gap:8px;border:1px solid #2A3050;border-bottom:0;border-radius:6px 6px 0 0;font-family:'JetBrains Mono',monospace;font-size:13px;color:#9AA3C7;background:#11152A}
.proc.on{color:#0B0D17;background:#3DF5E0;border-color:#3DF5E0}
.row{display:grid;grid-template-columns:22px minmax(110px,auto) minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:12px 16px;border:0;border-bottom:1px solid #1D2240;background:transparent;color:#E6E9F5;font:inherit;text-align:left;cursor:pointer}
.row:hover{background:rgba(61,245,224,.06)}
.row[aria-selected=true]{background:linear-gradient(90deg,rgba(61,245,224,.18),rgba(61,245,224,.02));box-shadow:inset 3px 0 0 #3DF5E0}
.kbd{font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid #2A3050;border-bottom-width:2px;border-radius:4px;padding:0 6px;color:#E6E9F5}
.corner{position:relative;padding:22px}
.corner::before,.corner::after{content:'';position:absolute;width:18px;height:18px;border:2px solid #FF4FA3}
.corner::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.corner::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
@media (max-width:760px){.wrap{padding:0 16px}.row{grid-template-columns:minmax(0,auto) minmax(0,1fr)}.row .hide{display:none}}
</style>
</helmet>
<div class="bg scan">
  <header class="wrap" style="display: flex; align-items: center; flex-wrap: wrap; gap: 14px 24px; padding-top: 18px; padding-bottom: 18px">
    <a href="NeonHome.dc.html" class="px glow-m" style="font-size: 28px; text-decoration: none">nyars<span class="glow-c">.辞</span></a>
    <form role="search" class="box" style="flex: 1 1 480px; display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 50px; box-shadow: 0 0 24px -8px rgba(61,245,224,.6)">
      <span class="mono glow-c" aria-hidden="true">›</span>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Поиск</label>
      <input id="q" type="search" value="かける pos:v" class="px" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #fff; font-size: 22px; outline: none">
      <span class="mono" style="font-size: 12px; color: #9AA3C7">55 hits · 12ms</span>
    </form>
  </header>

  <main class="wrap" style="padding-top: 10px; padding-bottom: 72px">
    <div role="tablist" aria-label="Словари" style="display: flex; gap: 4px; overflow-x: auto">
      <span class="proc on" role="tab" aria-selected="true">jp-ru <b>55</b></span>
      <span class="proc" role="tab" aria-selected="false">kanji 8</span>
      <span class="proc" role="tab" aria-selected="false">satellites 31</span>
      <span class="proc" role="tab" aria-selected="false">ocr 17</span>
      <span class="proc" role="tab" aria-selected="false" style="opacity: .6">ru-jp 0</span>
    </div>
    <div class="box" style="border-radius: 0 6px 6px 6px; display: flex; flex-wrap: wrap; min-height: 900px">
      <div role="listbox" aria-label="Результаты" style="flex: 1 1 520px; min-width: 0; border-right: 1px solid #2A3050">
        <div class="mono" style="padding: 10px 16px; font-size: 12px; color: #9AA3C7; border-bottom: 1px solid #2A3050; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px"><span>exact reading · 9</span><span><span class="kbd">J</span> <span class="kbd">K</span> move · <span class="kbd">⏎</span> open · <span class="kbd">E</span> edit</span></div>
        <sc-for list="{{ items }}" as="r" hint-placeholder-count="9">
          <button type="button" role="option" class="row" aria-selected="{{ r.on }}" onClick="{{ r.pick }}">
            <span class="mono hide" style="font-size: 12px; color: #9AA3C7">{{ r.i }}</span>
            <span class="px" lang="ja" style="font-size: 28px; color: {{ r.col }}; text-shadow: {{ r.glow }}">{{ r.w }}</span>
            <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px">{{ r.hint }}</span>
            <span class="mono hide" style="font-size: 11px; color: #9AA3C7">{{ r.tag }}</span>
          </button>
        </sc-for>
        <div class="mono" style="padding: 12px 16px; font-size: 12px; color: #9AA3C7; border-top: 1px solid #2A3050">contains · 46 — <a href="#">出かける</a> · <a href="#">見かける</a> · <a href="#">話しかける</a> · <a href="#">追いかける</a> · <a href="#">…</a></div>
      </div>

      <section aria-live="polite" style="flex: 1 1 460px; min-width: 0; padding: 28px; display: flex; flex-direction: column; gap: 18px">
        <div class="mono" style="font-size: 12px; color: #9AA3C7">preview · {{ cur.i }}/9</div>
        <div class="corner box" style="background: rgba(11,13,23,.6)">
          <h1 class="px glow-c" lang="ja" style="margin: 0; font-size: 84px; font-weight: 400; line-height: 1.05">{{ cur.w }}</h1>
          <p class="px" lang="ja" style="margin: 4px 0 0; font-size: 20px; color: #9AA3C7">かける</p>
          <p class="mono" style="margin: 12px 0 0; display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px"><span style="border: 1px solid #3DF5E0; color: #3DF5E0; padding: 2px 8px; border-radius: 3px">{{ cur.pos }}</span><sc-if value="{{ cur.common }}" hint-placeholder-val="{{ false }}"><span style="border: 1px solid #FFC857; color: #FFC857; padding: 2px 8px; border-radius: 3px">common</span></sc-if></p>
        </div>
        <sc-if value="{{ cur.note }}" hint-placeholder-val="{{ false }}"><p class="mono" style="margin: 0; font-size: 13px; color: #FF4FA3">// {{ cur.note }}</p></sc-if>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{ cur.senses }}" as="s" hint-placeholder-count="4"><li style="display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; font-size: 18px"><span class="mono glow-m" style="font-size: 15px">{{ s.n }}</span><span>{{ s.t }}</span></li></sc-for>
        </ol>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto">
          <a href="NeonEntry.dc.html" class="mono" style="height: 44px; padding: 0 18px; display: flex; align-items: center; background: #3DF5E0; color: #0B0D17; border-radius: 4px; font-weight: 700">open ⏎</a>
          <a href="#" class="mono" style="height: 44px; padding: 0 18px; display: flex; align-items: center; border: 1px solid #2A3050; border-radius: 4px">edit E</a>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1600}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 0 }; }
  renderVals() {
    const R = [
      { w: '掛ける', hint: 'вешать; тратить; звонить; умножать…', tag: 'v1 · N4', common: true, pos: 'v1 · 15 senses', senses: ['вешать, подвешивать', 'надевать (очки); накрывать', 'тратить (время, деньги)', 'звонить (по телефону)', 'умножать'] },
      { w: '欠ける', hint: 'откалываться; недоставать', tag: 'v1 · N3', common: true, pos: 'v1', senses: ['откалываться, отбиваться', 'недоставать, не хватать', 'убывать (о луне)'] },
      { w: '駆ける', hint: 'бежать, мчаться', tag: 'v1 · N1', common: true, pos: 'v1', senses: ['бежать, мчаться', 'скакать (на лошади)'] },
      { w: '賭ける', hint: 'ставить на кон; рисковать', tag: 'v1 · N2', common: true, pos: 'v1', senses: ['ставить, держать пари', 'рисковать (жизнью)'] },
      { w: '架ける', hint: 'наводить (мост)', tag: 'v1', pos: 'v1', note: 'usually written 掛ける', senses: ['перекидывать, наводить (мост)'] },
      { w: '懸ける', hint: 'назначать (награду)', tag: 'v1', pos: 'v1', note: 'see also 掛ける, 賭ける', senses: ['назначать (награду)', 'ставить на карту (честь)'] },
      { w: '翔る', hint: 'парить, высоко лететь', tag: 'v5 · книжн.', pos: 'v5r · literary', senses: ['парить, высоко лететь', 'мчаться, нестись'] },
      { w: '書ける', hint: 'мочь писать', tag: 'v1 · N5', common: true, pos: 'v1 · potential', note: 'potential form of 書く', senses: ['мочь писать', 'хорошо пишется (о ручке)'] },
      { w: '〜かける', hint: 'начать и не закончить', tag: 'aux', pos: 'aux-v', note: 'after masu-stem: 読みかける', senses: ['начинать (делать)', 'не доделать', 'обращать действие к кому-л.'] }
    ];
    const sel = this.state.sel;
    const items = R.map((r, i) => ({ ...r, i: String(i + 1).padStart(2, '0'), on: i === sel,
      col: i === sel ? '#3DF5E0' : '#FFFFFF', glow: i === sel ? '0 0 10px rgba(61,245,224,.8)' : 'none',
      pick: () => this.setState({ sel: i }) }));
    const c = R[sel];
    return { items, cur: { ...c, i: sel + 1, common: !!c.common, note: c.note || '', senses: c.senses.map((t, i) => ({ n: String(i + 1).padStart(2, '0'), t })) } };
  }
}
</script>
</body>
</html>
